<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ZPMC Food</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: #1e293b;
        --border: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      text-align: center;
      max-width: 450px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    }

    .icon-container {
      background: rgba(37, 99, 219, 0.1);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--primary);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 219, 0.2);
    }

    .btn-retry:hover {
      background-color: var(--primary-hover);
    }

    .btn-retry:active {
      transform: scale(0.98);
    }

    .branding {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .branding img {
      height: 18px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5a3 3 0 0 1 3 3 3.09 3.09 0 0 1-2.06 2.87M5 5a10.94 10.94 0 0 0-4 4v.5a3 3 0 0 0 3 3 3.14 3.14 0 0 0 1-.17M9.09 9.09a3 3 0 0 0 2.24 2.24M6.18 6.18A11 11 0 0 0 12 18a10.9 10.9 0 0 0 2.18-.22" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </svg>
    </div>
    <h1>No Internet Connection</h1>
    <p>It looks like you're offline. ZPMC Food ordering portal requires an internet connection to sync your requests. We'll load the app as soon as you reconnect.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
    <div class="branding">
      <img src="/apple-touch-icon.png" alt="ZPMC Logo" onerror="this.style.display='none'">
      <span>ZPMC Food Ordering</span>
    </div>
  </div>
</body>
</html>
